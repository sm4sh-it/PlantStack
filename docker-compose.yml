version: '3.8'

services:
  plantstack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plantstack
    restart: unless-stopped
    ports:
      - "${PLANTSTACK_BIND_ADDR:-0.0.0.0}:9666:3000"
    volumes:
      - plantstack_data:/app/data
    environment:
      - NODE_ENV=production
      - OPENPLANTBOOK_CLIENT_ID=${OPENPLANTBOOK_CLIENT_ID}
      - OPENPLANTBOOK_CLIENT_SECRET=${OPENPLANTBOOK_CLIENT_SECRET}
      - PLANTSTACK_API_SECRET=${PLANTSTACK_API_SECRET:-}
      - PLANTSTACK_STATUS_TOKEN=${PLANTSTACK_STATUS_TOKEN:-}
      - PLANTSTACK_PUBLIC_ORIGIN=${PLANTSTACK_PUBLIC_ORIGIN:-}
      - PLANTSTACK_TRUST_PROXY=${PLANTSTACK_TRUST_PROXY:-false}

volumes:
  plantstack_data:
